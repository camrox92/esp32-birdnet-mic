name: arduino-build

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sketch/web UI unit tests
        run: |
          node tests/webui_health_test.js
          g++ -std=c++11 -Wall -Wextra -Werror tests/discovery_progress_test.cpp -o /tmp/discovery-test
          /tmp/discovery-test
          g++ -std=c++11 -Wall -Wextra -Werror -Itests/stubs tests/discovery_client_test.cpp -o /tmp/discovery-client-test
          /tmp/discovery-client-test

  compile:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.0'

      - name: Install pinned build dependencies
        run: python3 tools/check_build_dependencies.py --install

      - name: Compile M5Stack Atom Echo
        run: |
          arduino-cli compile --fqbn "esp32:esp32:m5stack_atom" esp32-birdnet-mic
